<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101014"><title>Broken Butterfly • GoBrew</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#f4f4f5;background:#101014}*{box-sizing:border-box}body{margin:0;padding:18px 14px 80px;max-width:760px;margin:auto}header{text-align:center;padding:18px 0}h1{font-size:27px;letter-spacing:1px;margin:4px}small{color:#a1a1aa}h2{font-size:15px;color:#d8b4fe;letter-spacing:2px}#progress{position:sticky;top:0;background:#101014ef;backdrop-filter:blur(8px);padding:12px 0;z-index:2}.bar{height:10px;border-radius:20px;background:#333;overflow:hidden;margin-top:8px}.fill{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#e879f9);transition:width .2s}.song{display:flex;align-items:center;gap:12px;padding:15px 12px;border:1px solid #34343d;border-radius:12px;margin:9px 0;background:#1c1c24;cursor:pointer;min-height:69px}.song.done{opacity:.63;border-color:#8b5cf6}.song.done .name{text-decoration:line-through}.num{color:#a78bfa;font-weight:800;min-width:28px}.name{font-size:17px;font-weight:750}.artist{color:#aaa;font-size:13px;margin-top:3px}.check{margin-left:auto;font-size:25px;color:#c4b5fd}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,input{border-radius:9px;padding:12px;font:inherit}button{background:#6d28d9;color:white;border:0;font-weight:700}button.secondary{background:#30303b}input{background:#23232c;color:white;border:1px solid #666;min-width:0;flex:1}#status{font-size:13px;color:#fbbf24;margin:8px 0}#room{font-weight:700}footer{color:#aaa;font-size:12px;line-height:1.5;margin-top:28px}label{display:block;font-size:13px;color:#aaa;margin-top:12px}</style></head><body><header><small>07 NOV 2026 • GOBREW</small><h1>🦋 BROKEN BUTTERFLY</h1><small>REPERTÓRIO • CHECKLIST AO VIVO</small></header><section id="progress"><div><strong id="count">0 / 27</strong> músicas tocadas <span id="percent" style="float:right">0%</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="status">Conectando ao Firebase...</div></section><label>Sala compartilhada (mesmo nome para toda a banda)</label><div class="controls"><input id="room" value="broken-gobrew-0711" aria-label="Nome da sala"><button id="join">Entrar</button></div><div class="controls"><button class="secondary" id="copy">Copiar link da sala</button><button class="secondary" id="reset">Zerar checklist</button></div><h2>SETLIST</h2><main id="songs"></main><h2>🔥 BIS</h2><div id="encore"></div><footer>Checklist sincronizado pelo Firebase. Compartilhe o link apenas com a banda. O acesso anônimo não restringe a exatamente cinco pessoas.</footer><script type="module">

const firebaseConfig = {apiKey:"AIzaSyCilR5BmLFKAf3kno9nR7zmfuQELd774bQ",authDomain:"broken-butterfly-live-7557c.firebaseapp.com",databaseURL:"https://broken-butterfly-live-7557c-default-rtdb.firebaseio.com",projectId:"broken-butterfly-live-7557c",storageBucket:"broken-butterfly-live-7557c.firebasestorage.app",messagingSenderId:"831881871969",appId:"1:831881871969:web:8a10e9d9e356c149aee020"};
const songs=[['Mr. Crowley','Ozzy Osbourne'],["It's So Easy","Guns N' Roses"],['Man in the Box','Alice in Chains'],['Psycho Killer','Talking Heads'],['Fátima','Capital Inicial'],['Still Loving You','Scorpions'],['A Sua Maneira','Capital Inicial'],['Tempo Perdido','Legião Urbana'],['Clube dos Canalhas','Matanza'],['Crazy Train','Ozzy Osbourne'],['Basket Case','Green Day'],['Holy Diver','Dio'],['Fade to Black','Metallica'],['Is This Love','Whitesnake'],['Creep','Radiohead'],['Simple Man','Lynyrd Skynyrd'],['Rape Me','Nirvana'],['Seven Nation Army','The White Stripes'],['Lonely Day','System of a Down'],['Eu Quero é Ver o Oco','Raimundos'],['Balls to the Wall','Accept'],['All the Small Things','blink-182'],['N.I.B.','Black Sabbath'],['Paranoid','Black Sabbath'],['Everlong','Foo Fighters'],['T.N.T.','AC/DC'],["Sweet Child O' Mine","Guns N' Roses"]];

const $=id=>document.getElementById(id);
let state={},db=null,stop=null,connected=false,activeRoom='';
const params=new URLSearchParams(location.search);
$('room').value=params.get('sala')||'broken-gobrew-0711';
const cleanRoom=()=>($('room').value.trim().replace(/[^a-zA-Z0-9_-]/g,'-').slice(0,80)||'broken-gobrew-0711');
function render(){for(const id of ['songs','encore'])$(id).replaceChildren();songs.forEach(([name,artist],i)=>{let el=document.createElement('div');el.className='song'+(state[i]?' done':'');el.setAttribute('role','checkbox');el.setAttribute('aria-checked',String(!!state[i]));el.tabIndex=0;el.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><div><div class="name"></div><div class="artist"></div></div><span class="check">${state[i]?'☑':'☐'}</span>`;el.querySelector('.name').textContent=name;el.querySelector('.artist').textContent=artist;const toggle=()=>change(i,!state[i]);el.onclick=toggle;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}};$(i===26?'encore':'songs').append(el)});const n=Object.values(state).filter(Boolean).length;$('count').textContent=n+' / 27';$('percent').textContent=Math.round(n/27*100)+'%';$('fill').style.width=n/27*100+'%'}
async function change(i,value){if(!connected){$('status').textContent='Aguarde a conexão para marcar músicas.';return}try{await set(ref(db,'rooms/'+activeRoom+'/checked/'+i),value)}catch(e){$('status').textContent='Erro ao salvar: '+e.message}}
function join(){if(!db)return;if(stop)stop();connected=false;state={};render();activeRoom=cleanRoom();history.replaceState(null,'',location.pathname+'?sala='+encodeURIComponent(activeRoom));$('status').textContent='Conectando à sala '+activeRoom+'...';stop=onValue(ref(db,'rooms/'+activeRoom+'/checked'),snap=>{state=snap.val()||{};connected=true;render();$('status').textContent='🟢 Ao vivo • Sala: '+activeRoom},e=>{connected=false;$('status').textContent='Erro de acesso: '+e.message})}
$('join').onclick=join;
$('copy').onclick=async()=>{const url=location.href.split('?')[0]+'?sala='+encodeURIComponent(cleanRoom());try{await navigator.clipboard.writeText(url);$('status').textContent='Link copiado!'}catch{$('status').textContent='Copie o endereço do navegador para compartilhar.'}};
$('reset').onclick=async()=>{if(!connected)return;if(confirm('Zerar as 27 marcações para todos nesta sala?'))try{await remove(ref(db,'rooms/'+activeRoom+'/checked'))}catch(e){$('status').textContent='Erro ao zerar: '+e.message}};
render();$('status').textContent='Conectando ao Firebase...';
try{const app=initializeApp(firebaseConfig);const auth=getAuth(app);await signInAnonymously(auth);db=getDatabase(app);join()}catch(e){$('status').textContent='Não foi possível conectar: '+e.message+' (confira autenticação anônima e regras do banco)'}
</script></body></html>
